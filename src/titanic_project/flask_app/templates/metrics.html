<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Evaluation Metrics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 32px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: white;
            padding: 28px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px
                rgba(0, 0, 0, 0.06);
        }

        .metric-name {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Model Evaluation</h1>
        <p class="subtitle">
            Classification performance metrics
        </p>

        <section class="metrics-grid">
            {% for name, value in metrics.items() %}
                <article class="metric-card">
                    <div class="metric-name">
                        {{ name }}
                    </div>

                    <div class="metric-value">
                        {{ "%.0f"|format(value * 100) }}%
                    </div>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
